<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GKS Partner - Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { theme: { extend: { colors: { bg: '#02060F', card: '#0A1128', border: '#1E2A45', gold: '#D4AF37', goldLight: '#F3E5AB', textMain: '#F8F9FA', textMuted: '#94A3B8' }, fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], serif: ['Cinzel', 'serif'] }, boxShadow: { 'glow': '0 0 20px rgba(212, 175, 55, 0.15)', 'card': '0 8px 30px rgba(0, 0, 0, 0.4)' } } } }</script>
<style>
  body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #02060F; color: #F8F9FA; }
  .h-serif { font-family: 'Cinzel', serif; }
  .gold-gradient { background: linear-gradient(135deg, #D4AF37 0%, #F3E5AB 50%, #D4AF37 100%); }
  .card-press:active { transform: scale(0.98); transition: 0.1s; }
  .glass { background: rgba(10, 17, 40, 0.9); backdrop-filter: blur(12px); border: 1px solid #1E2A45; }
</style>
</head>
<body class="min-h-screen relative overflow-x-hidden">
  <div class="absolute top-0 left-0 w-full h-64 bg-gradient-to-b from-[#0A1128] to-[#02060F] z-0 border-b border-border"></div>

<header class="relative z-10 px-6 py-6">
  <div class="max-w-4xl mx-auto flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl gold-gradient flex items-center justify-center text-bg font-bold text-xl shadow-glow h-serif">G</div>
      <div>
        <p class="h-serif font-bold text-lg leading-tight text-white">GKS Partner</p>
        <p id="shop-name" class="text-[11px] text-goldLight tracking-wide">—</p>
      </div>
    </div>
    <button onclick="logout()" id="logout-btn" class="hidden text-xs bg-card hover:bg-border border border-border text-white px-4 py-2 rounded-xl transition" data-i18n="logout">Logout</button>
  </div>
</header>

<!-- Login View -->
<div id="login-view" class="relative z-10 max-w-md mx-auto px-6 mt-10 animate-fade-up">
  <div class="glass rounded-3xl shadow-card p-8 border border-border">
    <h2 class="h-serif text-3xl text-white mb-1 font-bold" data-i18n="welcome">Welcome back</h2>
    <p class="text-sm text-textMuted mb-6 font-light" data-i18n="sub_welcome">Apni dukaan sambhalo aur aage badho</p>
    
    <div class="space-y-4">
      <div>
        <label class="text-xs font-semibold text-textMuted ml-1 mb-1 block" data-i18n="phone_label">Phone Number</label>
        <input id="l-phone" placeholder="9990000001" class="w-full bg-bg border border-border text-white rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-gold transition-all">
      </div>
      <div>
        <label class="text-xs font-semibold text-textMuted ml-1 mb-1 block" data-i18n="pass_label">Password</label>
        <input id="l-pass" type="password" placeholder="••••••••" class="w-full bg-bg border border-border text-white rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-gold transition-all">
      </div>
    </div>
    
    <button onclick="login()" class="mt-6 w-full gold-gradient text-bg py-3.5 rounded-xl font-bold shadow-glow card-press transition-all text-lg" data-i18n="login_btn">Login</button>
    <p id="l-err" class="text-red-400 text-xs mt-3 text-center font-medium"></p>
    
    <div class="mt-8 pt-6 border-t border-border">
      <p class="text-xs text-textMuted text-center mb-4"><span data-i18n="new_shop">Naya shop?</span> <a href="/register" class="text-gold font-bold underline decoration-gold underline-offset-2" data-i18n="reg_here">Register karo</a></p>
      <div class="bg-bg rounded-xl p-3 border border-border">
        <p class="text-[10px] text-textMuted text-center uppercase tracking-widest mb-2 font-bold">Demo Logins (Pass: demo123)</p>
        <div class="text-[11px] text-goldLight flex justify-center gap-4 font-medium"><p>💎 9990000001</p><p>📱 9990000011</p></div>
      </div>
    </div>
  </div>
</div>

<!-- Dashboard View -->
<div id="dash-view" class="relative z-10 hidden max-w-4xl mx-auto p-6 space-y-6">
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <div class="glass rounded-2xl p-5 shadow-card border-l-4 border-l-gold relative overflow-hidden">
      <p class="text-[11px] uppercase text-textMuted font-bold tracking-wider" data-i18n="stat_items">Total Items</p>
      <p id="stat-items" class="h-serif text-4xl font-bold text-white mt-2">0</p>
    </div>
    <div class="glass rounded-2xl p-5 shadow-card border-l-4 border-l-green-500 relative overflow-hidden">
      <p class="text-[11px] uppercase text-textMuted font-bold tracking-wider" data-i18n="stat_leads">Customer Leads</p>
      <p id="stat-leads" class="h-serif text-4xl font-bold text-white mt-2">0</p>
    </div>
    <div class="glass rounded-2xl p-5 shadow-card border-l-4 border-l-blue-500 relative overflow-hidden">
      <p class="text-[11px] uppercase text-textMuted font-bold tracking-wider" data-i18n="stat_status">Account Status</p>
      <p id="stat-status" class="text-lg font-bold text-green-400 mt-3 flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> <span data-i18n="verified">Verified</span></p>
    </div>
  </div>

  <div class="glass rounded-3xl p-6 shadow-card border border-border mt-8">
    <h3 class="h-serif text-2xl font-bold text-white mb-4" data-i18n="add_title">Naya Product Add karein</h3>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
      <input id="a-name" data-i18n-placeholder="ph_name" placeholder="Product ka naam (e.g. Gold Ring)" class="md:col-span-2 bg-bg border border-border text-white rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-gold transition-all">
      <input id="a-cat" data-i18n-placeholder="ph_cat" placeholder="Category (e.g. Ring)" class="bg-bg border border-border text-white rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-gold transition-all">
      <input id="a-price" data-i18n-placeholder="ph_price" type="number" placeholder="Price ₹" class="bg-bg border border-border text-white rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-gold transition-all">
      <input id="a-attr1" data-i18n-placeholder="ph_attr1" placeholder="Attribute 1 (e.g. 22K)" class="bg-bg border border-border text-white rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-gold transition-all">
      <input id="a-attr2" data-i18n-placeholder="ph_attr2" type="number" placeholder="Attribute 2 (e.g. 5g)" class="bg-bg border border-border text-white rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-gold transition-all">
    </div>
    <button onclick="addItem()" class="mt-5 w-full bg-card border border-gold/50 text-gold hover:bg-gold/10 py-3.5 rounded-xl font-bold card-press transition-all text-sm uppercase tracking-wider" data-i18n="add_btn">+ Add Product</button>
    <p id="a-msg" class="text-sm mt-3 text-center font-medium"></p>
  </div>

  <div class="glass rounded-3xl p-6 shadow-card border border-border">
    <h3 class="h-serif text-2xl font-bold text-white mb-4" data-i18n="my_items">Aapke Products</h3>
    <div id="items-list" class="space-y-3"></div>
  </div>
</div>

<script>
const shopTranslations = {
  en: { welcome: "Welcome back", sub_welcome: "Manage your shop and grow", phone_label: "Phone Number", pass_label: "Password", login_btn: "Login", new_shop: "New shop?", reg_here: "Register here", logout: "Logout", stat_items: "Total Items", stat_leads: "Customer Leads", stat_status: "Account Status", verified: "Verified", add_title: "Add New Product", add_btn: "+ Add Product", my_items: "Your Products", ph_name: "Product name (e.g. Gold Ring)", ph_cat: "Category (e.g. Ring)", ph_price: "Price ₹", ph_attr1: "Attribute 1 (e.g. 22K)", ph_attr2: "Attribute 2 (e.g. 5g)" },
  hi: { welcome: "वापसी पर स्वागत है", sub_welcome: "अपनी दुकान संभालें और आगे बढ़ें", phone_label: "फ़ोन नंबर", pass_label: "पासवर्ड", login_btn: "लॉगिन करें", new_shop: "नई दुकान?", reg_here: "यहाँ रजिस्टर करें", logout: "लॉगआउट", stat_items: "कुल आइटम", stat_leads: "ग्राहक लीड्स", stat_status: "खाता स्थिति", verified: "सत्यापित", add_title: "नया उत्पाद जोड़ें", add_btn: "+ उत्पाद जोड़ें", my_items: "आपके उत्पाद", ph_name: "उत्पाद का नाम (जैसे गोल्ड रिंग)", ph_cat: "श्रेणी (जैसे रिंग)", ph_price: "कीमत ₹", ph_attr1: "विशेषता 1 (जैसे 22K)", ph_attr2: "विशेषता 2 (जैसे 5g)" },
  hing: { welcome: "Welcome back", sub_welcome: "Apni dukaan sambhalo aur aage badho", phone_label: "Phone Number", pass_label: "Password", login_btn: "Login karo", new_shop: "Naya shop?", reg_here: "Yahan register karo", logout: "Logout", stat_items: "Total Items", stat_leads: "Customer Leads", stat_status: "Account Status", verified: "Verified", add_title: "Naya Product Add karein", add_btn: "+ Add Product", my_items: "Aapke Products", ph_name: "Product ka naam (e.g. Gold Ring)", ph_cat: "Category (e.g. Ring)", ph_price: "Price ₹", ph_attr1: "Attribute 1 (e.g. 22K)", ph_attr2: "Attribute 2 (e.g. 5g)" }
};

let currentLang = localStorage.getItem('gks_lang') || 'en';
const langOrder = ['en', 'hi', 'hing'];
const langLabels = { en: '🌐 EN', hi: '🌐 HI', hing: '🌐 HING' };

function toggleLang() {
  let nextIndex = (langOrder.indexOf(currentLang) + 1) % langOrder.length;
  currentLang = langOrder[nextIndex];
  localStorage.setItem('gks_lang', currentLang);
  applyLanguage();
}
function applyLanguage() {
  const btn = document.getElementById('lang-btn');
  if(btn) btn.innerText = langLabels[currentLang];
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (shopTranslations[currentLang][key]) el.innerText = shopTranslations[currentLang][key];
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.getAttribute('data-i18n-placeholder');
    if (shopTranslations[currentLang][key]) el.placeholder = shopTranslations[currentLang][key];
  });
}

let token = localStorage.getItem('gks_token') || '';
async function login() { 
  const phone = document.getElementById('l-phone').value.trim(); 
  const password = document.getElementById('l-pass').value; 
  const res = await fetch('/shops/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone, password }) }); 
  if (!res.ok) { document.getElementById('l-err').textContent = 'Galat phone ya password'; return; } 
  const data = await res.json(); token = data.access_token; localStorage.setItem('gks_token', token); loadDashboard(); 
}
function logout() { token = ''; localStorage.removeItem('gks_token'); location.reload(); }

async function loadDashboard() {
  const h = { 'Authorization': 'Bearer ' + token };
  try {
    const shop = await (await fetch('/shops/me', { headers: h })).json();
    if (!shop.id) return logout();
    document.getElementById('login-view').classList.add('hidden'); 
    document.getElementById('dash-view').classList.remove('hidden'); 
    document.getElementById('logout-btn').classList.remove('hidden');
    document.getElementById('shop-name').textContent = shop.shop_name + ' · ' + shop.city;
    
    const items = await (await fetch('/shops/me/items', { headers: h })).json(); 
    document.getElementById('stat-items').textContent = items.length;
    
    const leads = await (await fetch('/shops/me/leads', { headers: h })).json(); 
    document.getElementById('stat-leads').textContent = leads.total;
    
    document.getElementById('items-list').innerHTML = items.map(it => `
      <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center bg-bg border border-border p-4 rounded-xl gap-3">
        <div class="flex-1 min-w-0">
          <p class="font-bold text-white text-base truncate">${it.name}</p>
          <p class="text-xs text-textMuted mt-1 font-medium">${it.category} · <span class="text-gold font-bold">₹${it.price_min}–${it.price_max}</span></p>
        </div>
        <button onclick="toggleStock(${it.id}, ${!it.in_stock})" class="${it.in_stock ? 'bg-green-500/10 text-green-400 border-green-500/20' : 'bg-red-500/10 text-red-400 border-red-500/20'} text-xs px-4 py-2 rounded-lg font-bold border transition-colors w-full sm:w-auto">
          ${it.in_stock ? '✓ In Stock' : '✗ Out of Stock'}
        </button>
      </div>
    `).join('') || '<p class="text-sm text-textMuted text-center py-6 bg-bg rounded-xl border border-dashed border-border">Abhi koi product nahi. Upar se add karein.</p>';
  } catch (e) { logout(); }
}

async function addItem() {
  const a1 = document.getElementById('a-attr1').value; 
  const a2 = parseFloat(document.getElementById('a-attr2').value) || 0;
  const body = { 
    name: document.getElementById('a-name').value, 
    category: document.getElementById('a-cat').value, 
    price_min: parseFloat(document.getElementById('a-price').value), 
    price_max: parseFloat(document.getElementById('a-price').value), 
    attributes: a1 ? { [a1 ? 'Info' : 'Qty']: a1, Qty: a2 } : { Qty: a2 }, 
    image_urls: [], in_stock: true 
  };
  const msg = document.getElementById('a-msg');
  if (!body.name || !body.price_min) { msg.textContent = '⚠️ Name aur price zaroori hai'; msg.className = 'text-sm mt-3 text-center text-red-400 font-medium'; return; }
  
  const res = await fetch('/shops/me/items', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }, body: JSON.stringify(body) });
  if (res.ok) { 
    msg.textContent = '✅ Product successfully add ho gaya!'; msg.className = 'text-sm mt-3 text-center text-green-400 font-medium'; 
    ['a-name','a-cat','a-price','a-attr1','a-attr2'].forEach(id => document.getElementById(id).value = ''); 
    loadDashboard(); 
  } else { 
    msg.textContent = '❌ Error aaya. Dobara try karein.'; msg.className = 'text-sm mt-3 text-center text-red-400 font-medium'; 
  }
}
async function toggleStock(id, state) { await fetch(`/shops/me/items/${id}/stock?in_stock=${state}`, { method: 'PATCH', headers: { 'Authorization': 'Bearer ' + token } }); loadDashboard(); }

applyLanguage();
if (token) loadDashboard();
</script>
</body>
</html>
