<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>GKS — Premium Discovery</title>
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#0a192f">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: { navy: '#0a192f', navyDeep: '#020c1b', gold: '#d4af37', goldLight: '#f4d47c', cream: '#f8f9fa' },
  fontFamily: { sans: ['Outfit', 'sans-serif'], serif: ['Playfair Display', 'serif'] },
  boxShadow: { 'glow': '0 0 25px rgba(212, 175, 55, 0.4)', 'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.1)' },
  animation: { 'fade-up': 'fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both', 'float': 'float 4s ease-in-out infinite', 'spin-slow': 'spin 8s linear infinite' },
  keyframes: {
    fadeUp: { '0%': {opacity: 0, transform: 'translateY(30px)'}, '100%': {opacity: 1, transform: 'translateY(0)'} },
    float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-8px)' } }
  }
}}}
</script>
<style>
  body { font-family: 'Outfit', sans-serif; background: #f8f9fa; -webkit-tap-highlight-color: transparent; }
  .h-serif { font-family: 'Playfair Display', serif; }
  .gold-gradient { background: linear-gradient(135deg, #d4af37 0%, #f4d47c 50%, #d4af37 100%); }
  .gold-text { background: linear-gradient(135deg, #d4af37 0%, #f4d47c 50%, #d4af37 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .navy-gradient { background: linear-gradient(180deg, #0a192f 0%, #020c1b 100%); }
  .glass-nav { background: rgba(10, 25, 47, 0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255,255,255,0.05); }
  .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.5); }
  .card-press:active { transform: scale(0.96); transition: 0.1s; }
  
  /* Premium Active State for Tabs */
  .sector-active { background: linear-gradient(135deg, #d4af37 0%, #f4d47c 50%, #d4af37 100%); color: #0a192f; box-shadow: 0 4px 15px rgba(212,175,55,0.4); font-weight: 600; transform: translateY(-2px); border-color: transparent; }
  
  .hide-scroll::-webkit-scrollbar { display: none; }
  
  /* Premium Logo Animation */
  .logo-ring { border: 2px solid rgba(212, 175, 55, 0.2); border-top-color: #d4af37; border-radius: 50%; animation: spin 4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body class="text-gray-800 min-h-screen pb-24">

<!-- Premium Header -->
<header class="glass-nav text-white px-4 pt-5 pb-4 sticky top-0 z-30">
  <div class="max-w-4xl mx-auto flex items-center justify-between">
    <div class="flex items-center gap-3">
      <!-- Stylish Logo -->
      <div class="relative w-11 h-11 flex items-center justify-center">
        <div class="absolute inset-0 logo-ring"></div>
        <div class="w-9 h-9 rounded-full gold-gradient flex items-center justify-center text-navy font-bold text-xl shadow-[0_0_15px_rgba(212,175,55,0.5)] z-10 font-serif">G</div>
      </div>
      <div>
        <h1 class="h-serif text-xl leading-tight font-bold tracking-wide">GKS</h1>
        <p class="text-[9px] uppercase tracking-[3px] text-goldLight opacity-90">Ganguli Kynetic</p>
      </div>
    </div>
    <div class="flex gap-2 items-center">
      <button onclick="toggleLang()" id="lang-btn" class="text-[11px] bg-white/10 hover:bg-white/20 transition border border-white/20 px-3 py-1.5 rounded-full font-semibold">🌐 EN</button>
      <button onclick="getLocation()" class="text-[11px] bg-white/10 hover:bg-white/20 transition border border-white/20 px-3 py-1.5 rounded-full flex items-center gap-1">
        <svg class="w-3 h-3 text-goldLight" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        <span id="loc-label" data-i18n="loc_btn">Locate</span>
      </button>
    </div>
  </div>
</header>

<!-- Sector Tabs (Stylish SVG Icons) -->
<div class="bg-navyDeep px-3 pt-4 pb-5 sticky top-[76px] z-20 shadow-md">
  <div class="max-w-4xl mx-auto flex gap-3 overflow-x-auto hide-scroll">
    
    <!-- Jewellery Tab -->
    <button onclick="pickSector('GJS')" id="tab-GJS" class="sector-tab flex-shrink-0 px-4 py-2.5 rounded-xl text-xs bg-white/5 text-white/70 border border-white/10 transition-all duration-300 flex items-center gap-2">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>
      <span data-i18n="tab_gjs">Jewellery</span>
    </button>

    <!-- Electronics Tab -->
    <button onclick="pickSector('GES')" id="tab-GES" class="sector-tab flex-shrink-0 px-4 py-2.5 rounded-xl text-xs bg-white/5 text-white/70 border border-white/10 transition-all duration-300 flex items-center gap-2">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
      <span data-i18n="tab_ges">Electronics</span>
    </button>

    <!-- Grocery Tab -->
    <button onclick="pickSector('GGS')" id="tab-GGS" class="sector-tab flex-shrink-0 px-4 py-2.5 rounded-xl text-xs bg-white/5 text-white/70 border border-white/10 transition-all duration-300 flex items-center gap-2">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
      <span data-i18n="tab_ggs">Grocery</span>
    </button>

    <!-- Medicine Tab -->
    <button onclick="pickSector('GMS')" id="tab-GMS" class="sector-tab flex-shrink-0 px-4 py-2.5 rounded-xl text-xs bg-white/5 text-white/70 border border-white/10 transition-all duration-300 flex items-center gap-2">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
      <span data-i18n="tab_gms">Medicine</span>
    </button>

  </div>
</div>

<main class="max-w-4xl mx-auto px-4 pt-6">
  <!-- Hero Section with Gradient Text -->
  <div class="mb-6 animate-fade-up text-center">
    <h2 class="h-serif text-3xl text-navy mb-2 font-bold" id="hero-title" data-i18n="hero_title_gjs">Nazdeek ki jewellery</h2>
    <p class="text-sm text-gray-500 font-light" id="hero-sub" data-i18n="hero_sub_gjs">Apni location dein aur paas ki premium dukaanein dhundhein</p>
  </div>

  <!-- Search Bar -->
  <div class="glass-card rounded-2xl shadow-glass p-2 mb-6 animate-fade-up" style="animation-delay: 100ms">
    <div class="flex gap-2">
      <div class="flex-1 relative">
        <svg class="w-5 h-5 absolute left-4 top-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        <input id="category" data-i18n-placeholder="search_placeholder" placeholder="Search rings, chains, mobiles..." onkeydown="if(event.key==='Enter')search()" class="w-full bg-gray-50/50 border-none rounded-xl pl-11 pr-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-gold/50 transition-all">
      </div>
      <button onclick="search()" class="gold-gradient text-navy px-6 rounded-xl text-sm font-bold shadow-md card-press hover:shadow-glow transition-all" data-i18n="search_btn">Search</button>
    </div>
  </div>

  <!-- Disclaimer -->
  <div class="bg-blue-50/50 border border-blue-100 text-blue-800 text-[11px] p-3 rounded-xl mb-6 text-center animate-fade-up font-medium" style="animation-delay: 150ms" data-i18n="disclaimer">
    ⚠️ Availability shop par confirm karein. GKS koi delivery nahi karta.
  </div>

  <div id="results" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
  
  <!-- Empty State -->
  <div id="empty" class="hidden text-center text-gray-400 py-20 animate-fade-up">
    <div class="text-6xl mb-4 animate-float text-gold">✨</div>
    <p class="text-lg font-medium text-gray-600" data-i18n="empty_title">Kuch nahi mila</p>
    <p class="text-sm mt-1" data-i18n="empty_sub">Location dein, phir category chunein</p>
  </div>
</main>

<!-- Bottom Nav (SVG Icons) -->
<nav class="fixed bottom-4 left-4 right-4 bg-white/95 backdrop-blur-lg border border-gray-200 shadow-[0_10px_40px_rgba(0,0,0,0.1)] z-40 rounded-2xl max-w-md mx-auto">
  <div class="flex justify-around py-3">
    <button class="flex flex-col items-center text-gold group">
      <svg class="w-6 h-6 group-hover:-translate-y-1 transition-transform" fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path></svg>
      <span class="text-[10px] font-bold mt-1 text-navy" data-i18n="nav_home">Home</span>
    </button>
    <button onclick="document.getElementById('category').focus()" class="flex flex-col items-center text-gray-400 hover:text-navy transition group">
      <svg class="w-6 h-6 group-hover:-translate-y-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      <span class="text-[10px] mt-1" data-i18n="nav_search">Search</span>
    </button>
    <button onclick="getLocation()" class="flex flex-col items-center text-gray-400 hover:text-navy transition group">
      <svg class="w-6 h-6 group-hover:-translate-y-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
      <span class="text-[10px] mt-1" data-i18n="nav_near">Near me</span>
    </button>
    <a href="/register" class="flex flex-col items-center text-gray-400 hover:text-navy transition group">
      <svg class="w-6 h-6 group-hover:-translate-y-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
      <span class="text-[10px] mt-1" data-i18n="nav_shop">Shop</span>
    </a>
  </div>
</nav>

<!-- Premium Modal -->
<div id="modal" class="hidden fixed inset-0 bg-navyDeep/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center transition-opacity">
  <div class="bg-white w-full max-w-md rounded-t-[2rem] sm:rounded-3xl p-6 max-h-[90vh] overflow-y-auto animate-fade-up shadow-2xl relative">
    <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-5 sm:hidden"></div>
    <div class="flex justify-between items-start mb-5">
      <div>
        <p class="text-[10px] uppercase tracking-widest text-gold font-bold mb-1" data-i18n="modal_verified">Verified Store</p>
        <h3 id="m-shop" class="h-serif font-bold text-2xl text-navy"></h3>
      </div>
      <button onclick="closeModal()" class="bg-gray-100 hover:bg-gray-200 w-8 h-8 rounded-full flex items-center justify-center text-gray-500 transition">&times;</button>
    </div>
    <div id="m-body"></div>
  </div>
</div>

<script>
// Language Dictionary
const translations = {
  en: { loc_btn: "Locate", tab_gjs: "Jewellery", tab_ges: "Electronics", tab_ggs: "Grocery", tab_gms: "Medicine", hero_title_gjs: "Nearby Jewellery", hero_sub_gjs: "Enter your location to find premium stores near you", hero_title_ges: "Nearby Electronics", hero_sub_ges: "Find mobiles, laptops, and gadgets near you", hero_title_ggs: "Nearby Grocery", hero_sub_ggs: "Find daily essentials near you", hero_title_gms: "Nearby Pharmacy", hero_sub_gms: "Find licensed medical stores near you", search_placeholder: "Search rings, chains, mobiles...", search_btn: "Search", disclaimer: "⚠️ Availability is indicative. Please confirm at the shop. GKS does not deliver.", empty_title: "Nothing found", empty_sub: "Enter location and select a category", nav_home: "Home", nav_search: "Search", nav_near: "Near me", nav_shop: "Shop", modal_verified: "Verified Store", call_btn: "Call", map_btn: "Open Maps" },
  hi: { loc_btn: "लोकेशन", tab_gjs: "ज्वेलरी", tab_ges: "इलेक्ट्रॉनिक्स", tab_ggs: "किराना", tab_gms: "दवा", hero_title_gjs: "आस-पास की ज्वेलरी", hero_sub_gjs: "अपनी लोकेशन दें और पास की प्रीमियम दुकानें खोजें", hero_title_ges: "आस-पास का इलेक्ट्रॉनिक्स", hero_sub_ges: "अपने पास मोबाइल, लैपटॉप और गैजेट्स खोजें", hero_title_ggs: "आस-पास का किराना", hero_sub_ggs: "अपने पास रोज़मर्रा की ज़रूरतें खोजें", hero_title_gms: "आस-पास की फार्मेसी", hero_sub_gms: "अपने पास लाइसेंस प्राप्त मेडिकल स्टोर खोजें", search_placeholder: "रिंग, चेन, मोबाइल खोजें...", search_btn: "खोजें", disclaimer: "⚠️ उपलब्धता सांकेतिक है। कृपया दुकान पर पुष्टि करें। GKS डिलीवरी नहीं करता है।", empty_title: "कुछ नहीं मिला", empty_sub: "लोकेशन दें और श्रेणी चुनें", nav_home: "होम", nav_search: "खोजें", nav_near: "पास में", nav_shop: "दुकान", modal_verified: "सत्यापित स्टोर", call_btn: "कॉल करें", map_btn: "मैप खोलें" },
  hing: { loc_btn: "Locate", tab_gjs: "Jewellery", tab_ges: "Electronics", tab_ggs: "Grocery", tab_gms: "Medicine", hero_title_gjs: "Nazdeek ki Jewellery", hero_sub_gjs: "Apni location do aur paas ki premium dukaanein dhundo", hero_title_ges: "Nazdeek ka Electronics", hero_sub_ges: "Mobile, laptop aur gadgets paas mein dhundo", hero_title_ggs: "Nazdeek ka Grocery", hero_sub_ggs: "Atta, dal aur daily essentials paas mein dhundo", hero_title_gms: "Nazdeek ki Pharmacy", hero_sub_gms: "Licensed medical stores paas mein dhundo", search_placeholder: "Ring, Chain, Mobile dhundo...", search_btn: "Dhundo", disclaimer: "⚠️ Availability shop par confirm karein. GKS delivery nahi karta.", empty_title: "Kuch nahi mila", empty_sub: "Location do, phir category chuno", nav_home: "Home", nav_search: "Search", nav_near: "Near me", nav_shop: "Shop", modal_verified: "Verified Store", call_btn: "Call karein", map_btn: "Google Maps kholo" }
};

let currentLang = localStorage.getItem('gks_lang') || 'en';
const langOrder = ['en', 'hi', 'hing'];
const langLabels = { en: '🌐 EN', hi: '🌐 HI', hing: '🌐 HING' };

function toggleLang() {
  let nextIndex = (langOrder.indexOf(currentLang) + 1) % langOrder.length;
  currentLang = langOrder[nextIndex];
  localStorage.setItem('gks_lang', currentLang);
  applyLanguage();
}

function applyLanguage() {
  document.getElementById('lang-btn').innerText = langLabels[currentLang];
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (translations[currentLang][key]) el.innerText = translations[currentLang][key];
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.getAttribute('data-i18n-placeholder');
    if (translations[currentLang][key]) el.placeholder = translations[currentLang][key];
  });
  updateHeroText();
}

let lat = null, lng = null, sector = 'GJS';

function updateHeroText() {
  const titleKey = `hero_title_${sector.toLowerCase()}`;
  const subKey = `hero_sub_${sector.toLowerCase()}`;
  document.getElementById('hero-title').innerText = translations[currentLang][titleKey];
  document.getElementById('hero-sub').innerText = translations[currentLang][subKey];
}

function pickSector(s) {
  sector = s;
  document.querySelectorAll('.sector-tab').forEach(t => { t.classList.remove('sector-active'); t.classList.add('bg-white/5', 'text-white/70', 'border-white/10'); });
  const t = document.getElementById('tab-' + s); t.classList.remove('bg-white/5', 'text-white/70', 'border-white/10'); t.classList.add('sector-active');
  updateHeroText();
  document.getElementById('category').value = ''; 
  if (lat) search();
}

function getLocation() { 
  document.getElementById('loc-label').innerText = '...'; 
  if (!navigator.geolocation) return fallback(); 
  navigator.geolocation.getCurrentPosition(p => { lat = p.coords.latitude; lng = p.coords.longitude; document.getElementById('loc-label').innerText = 'Near you'; search(); }, () => fallback(), { timeout: 6000 }); 
}

function fallback() { lat = 22.5726; lng = 88.3639; document.getElementById('loc-label').innerText = 'Kolkata'; search(); }

async function search() {
  if (!lat) { getLocation(); return; }
  const cat = document.getElementById('category').value.trim();
  const url = `/items/nearby?lat=${lat}&lng=${lng}&sector_code=${sector}&radius_km=15` + (cat ? `&category=${encodeURIComponent(cat)}` : '');
  document.getElementById('empty').classList.add('hidden'); document.getElementById('results').innerHTML = '';
  try { const items = await (await fetch(url)).json(); renderResults(items); } catch (e) { document.getElementById('empty').classList.remove('hidden'); }
}

function renderResults(items) {
  const box = document.getElementById('results'); const empty = document.getElementById('empty');
  if (!items.length) { empty.classList.remove('hidden'); return; } empty.classList.add('hidden');
  
  items.forEach((it, i) => {
    const price = it.price_min === it.price_max ? `₹${it.price_min}` : `₹${it.price_min} – ₹${it.price_max}`;
    const chips = Object.entries(it.attributes || {}).slice(0, 3).map(([k, v]) => `<span class="text-[10px] bg-gray-100 text-gray-700 px-2.5 py-1 rounded-md font-semibold border border-gray-200">${k}: ${v}</span>`).join(' ');
    
    const el = document.createElement('div'); 
    el.className = 'bg-white rounded-2xl shadow-sm border border-gray-100 p-5 cursor-pointer card-press hover:shadow-xl hover:border-gold/30 hover:-translate-y-1 transition-all duration-300 animate-fade-up'; 
    el.style.animationDelay = (i * 50) + 'ms'; 
    el.onclick = () => openShop(it);
    
    el.innerHTML = `
      <div class="flex justify-between items-start gap-4">
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 mb-2">
            <span class="text-[10px] uppercase tracking-wider text-gold font-bold bg-gold/10 px-2 py-0.5 rounded">${it.category}</span>
          </div>
          <h3 class="h-serif font-bold text-navy text-xl leading-tight truncate">${it.name}</h3>
          <p class="text-navy font-bold mt-2 text-lg">${price}</p>
          <div class="flex flex-wrap gap-1.5 mt-3">${chips}</div>
        </div>
        <div class="flex flex-col items-end gap-3">
          <div class="bg-green-50 text-green-700 text-[10px] px-2.5 py-1 rounded-full font-bold uppercase tracking-wide border border-green-200 shadow-sm flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span> In Stock
          </div>
        </div>
      </div>
      <div class="mt-4 pt-3 border-t border-gray-100 flex items-center justify-between text-sm">
        <div class="text-gray-700 font-semibold truncate flex items-center gap-1.5"><span class="text-gray-400">🏪</span> ${it.shop_name}</div>
        <div class="text-gray-600 bg-gray-50 px-2.5 py-1 rounded-lg flex items-center gap-1 border border-gray-200 font-medium">📍 ${it.distance_km} km</div>
      </div>
    `;
    box.appendChild(el);
  });
}

async function openShop(it) {
  document.getElementById('m-shop').textContent = it.shop_name; 
  document.getElementById('m-body').innerHTML = '<div class="flex justify-center py-10"><div class="w-8 h-8 border-4 border-gray-200 border-t-gold rounded-full animate-spin"></div></div>'; 
  document.getElementById('modal').classList.remove('hidden');
  
  fetch('/leads', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ item_id: it.item_id, shop_id: it.shop_id, event_type: 'address_shared' }) }).catch(() => {});
  
  const c = await (await fetch(`/shops/${it.shop_id}/contact`)).json();
  const callTxt = translations[currentLang].call_btn;
  const mapTxt = translations[currentLang].map_btn;
  
  document.getElementById('m-body').innerHTML = `
    <div class="space-y-4">
      <div class="bg-gray-50 rounded-2xl p-4 border border-gray-100">
        <p class="text-sm font-bold text-navy mb-1">${c.shop_name}</p>
        <p class="text-sm text-gray-600 leading-relaxed">${c.address}, ${c.city} — ${c.pincode}</p>
      </div>
      <a href="tel:${c.phone}" class="block gold-gradient text-navy text-center py-3.5 rounded-xl font-bold shadow-md card-press text-lg flex justify-center items-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
        ${callTxt} ${c.phone}
      </a>
      <a href="${c.map_url}" target="_blank" class="block bg-navy text-white text-center py-3.5 rounded-xl font-semibold card-press flex justify-center items-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
        ${mapTxt}
      </a>
      <p class="text-[11px] text-gray-400 text-center pt-2 leading-relaxed">${c.disclaimer}</p>
    </div>
  `;
}
function closeModal() { document.getElementById('modal').classList.add('hidden'); }

applyLanguage();
pickSector('GJS');
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/static/sw.js');
</script>
